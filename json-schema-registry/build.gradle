import io.micronaut.testresources.buildtools.KnownModules

plugins {
    id("io.micronaut.build.internal.json-schema-module")
    id("io.micronaut.test-resources")
}

dependencies {
    api(projects.micronautJsonSchemaCommon)
    api(projects.micronautJsonSchemaGenerator)
    api(projects.micronautJsonSchemaUtils)
    api(mn.micronaut.context)
    api(mn.micronaut.inject)
    api(mn.micronaut.runtime)

    compileOnly(mn.micronaut.management)
    compileOnly(mnMicrometer.micronaut.micrometer.core)

    annotationProcessor(mn.micronaut.inject.java)

    testAnnotationProcessor(mn.micronaut.inject.java)
    testAnnotationProcessor(projects.micronautJsonSchemaProcessor)
    testImplementation(mn.micronaut.inject.java.test)
    testImplementation(mn.micronaut.management)
    testImplementation(mnTestResources.testcontainers.oracle.free)
    testImplementation(mnSql.ojdbc11)
    testImplementation(mnMicrometer.micronaut.micrometer.core)
    testImplementation(mnTest.junit.jupiter.api)
    testImplementation(mnTest.junit.jupiter.params)
    testRuntimeOnly(mnLogging.logback.classic)
    testRuntimeOnly(mnTest.junit.jupiter.engine)
    testRuntimeOnly(mnTest.junit.platform.launcher)
    testResourcesService(mnSql.ojdbc11)
}

micronautBuild {
    descriptor {
        parentModuleId = "io.micronaut.jsonschema:micronaut-json-schema-registry"
    }
}

micronaut {
    version libs.versions.micronaut.platform.get()
    testResources {
        enabled = true
        inferClasspath = false
        additionalModules.add(KnownModules.JDBC_ORACLE_FREE)
        clientTimeout = 300
        version = libs.versions.micronaut.testresources.get()
    }
}

tasks.matching { it.name == "internalStartTestResourcesService" }.configureEach {
    if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_25)) {
        setProperty("useClassDataSharing", false)
    }
}

tasks.withType(Test).configureEach {
    systemProperty "oracle.jdbc.timezoneAsRegion", "false"
}
