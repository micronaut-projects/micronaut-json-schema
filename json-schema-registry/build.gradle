plugins {
    id("io.micronaut.build.internal.json-schema-module")
    id("io.micronaut.minimal.application")
    id("io.micronaut.openapi")
}

micronaut {
    runtime "netty"
    testRuntime "junit5"
    openapi {
        server(file("registry.json")) {
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly(mn.micronaut.core.processor)

    implementation(projects.micronautJsonSchemaGenerator)
    implementation(mnSerde.micronaut.serde.jackson)
    implementation(mnValidation.validation)
    implementation("io.micronaut.security:micronaut-security")

    api(projects.micronautJsonSchemaAnnotations)
    api(projects.micronautJsonSchemaCommon)

    testImplementation(mnTest.micronaut.test.junit5)
    testImplementation(libs.junit.jupiter.api)
    testRuntimeOnly(libs.junit.jupiter.engine)
}

test {
    useJUnitPlatform()
}
