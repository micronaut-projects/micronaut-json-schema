import io.micronaut.build.internal.generator.BeanGeneratorTask
import io.micronaut.build.python.PythonCompile

plugins {
    id("java-library")
    id("io.micronaut.build.internal.test-suite-generator")
    id("io.micronaut.build.internal.python")
}

dependencies {
    implementation(projects.micronautJsonSchemaGenerator)
    implementation(mnSerde.micronaut.serde.jackson)
    implementation(mnValidation.validation)

    api(projects.micronautJsonSchemaAnnotations)

    // The generated Java beans are compiled in the main source set with the Java annotation processors.
    annotationProcessor(mn.micronaut.inject.java)
    annotationProcessor(mnSerde.micronaut.serde.processor)

    // Annotation processors MUST be testImplementation (not testAnnotationProcessor): the Python compiler
    // compiler takes the (jar-resolved) compile classpath as its annotation processor path.
    testImplementation(mnSerde.micronaut.serde.processor)
    testImplementation(mn.micronaut.inject.python.test)
    testImplementation(mn.micronaut.context.python)
    testImplementation(mn.micronaut.inject)
    testImplementation(mnTest.micronaut.test.junit5)
    testImplementation(mnTest.junit.jupiter.api)
    testRuntimeOnly(mnTest.junit.platform.launcher)
    testRuntimeOnly(mnTest.junit.jupiter.engine)
    testRuntimeOnly(mnLogging.logback.classic)
}

// The generator has no Python target: the Python tests consume the generated Java beans.
def beanGenerator = tasks.register("generateAnimals", BeanGeneratorTask) {
    language = "java"
    classpath.from(configurations.beanGenerator)
    jsonFile.convention(schemaFixturesDir.file("animal.schema.json"))
    outputDirectory.convention(layout.buildDirectory.dir("generated/jsonSchema"))
    packageName.convention("io.micronaut.jsonschema.generator.animals")
}

def refGenerator = tasks.register("generateRef", BeanGeneratorTask) {
    language = "java"
    classpath.from(configurations.beanGenerator)
    inputDirectory.convention(schemaFixturesDir.dir("ref"))
    outputDirectory.convention(layout.buildDirectory.dir("generated/jsonSchema"))
    packageName.convention("io.micronaut.jsonschema.generator.ref")
    acceptedUrlPatterns.convention(["^http://127\\.0\\.0\\.1:38080/[^?]+\\.json(#.*)?\$"])
    usesService(mockSchemaServer)
    doFirst { mockSchemaServer.get() } // force eager start before the subprocess runs
}

sourceSets {
    main {
        java.srcDir(beanGenerator.map(BeanGeneratorTask::getGeneratedSourcesDirectory))
        java.srcDir(refGenerator.map(BeanGeneratorTask::getGeneratedSourcesDirectory))
    }
}

// The Python compile classpath only contains jars: make the generated beans of this project visible.
tasks.named("compileTestPython", PythonCompile) {
    dependsOn(tasks.named("classes"))
    classpath.from(sourceSets.main.output)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty "micronaut.python.pool.enabled", "false"
}
