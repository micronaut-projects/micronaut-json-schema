plugins {
    id 'java-library'
    id 'io.micronaut.build.internal.json-schema-base'
}

// Technology compatibility kit of JsonSchemaValidator implementations: the tests are in src/main and are run by the
// test suites of micronaut-json-schema-validator and micronaut-json-schema-validator-networknt.
dependencies {
    api(projects.micronautJsonSchemaValidator)
    api(projects.micronautJsonSchemaAnnotations)
    api(mnValidation.micronaut.validation)
    api(mn.micronaut.jackson.databind)
    api(mnTest.micronaut.test.junit5)
    api(mnTest.junit.jupiter.api)
    api(mnTest.junit.jupiter.params)

    annotationProcessor(projects.micronautJsonSchemaProcessor)
    annotationProcessor(mnValidation.micronaut.validation.processor)
    annotationProcessor(mn.micronaut.inject.java)
}
