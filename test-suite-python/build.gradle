plugins {
    id 'java-library'
    id 'io.micronaut.build.internal.python'
}

dependencies {
    // Annotation processors MUST be testImplementation (not testAnnotationProcessor): the Python compiler
    // compiler takes the (jar-resolved) compile classpath as its annotation processor path.
    testImplementation(projects.micronautJsonSchemaProcessor)
    testImplementation(mnSerde.micronaut.serde.processor)
    testImplementation(mn.micronaut.inject.python.test)
    testImplementation(mn.micronaut.context.python)

    testImplementation(mnValidation.validation)
    testImplementation(projects.micronautJsonSchemaAnnotations)
    testImplementation(mnSerde.micronaut.serde.jackson)
    testImplementation(projects.micronautJsonSchemaConfigurationValidator)
    testImplementation(projects.micronautJsonSchemaValidation)
    testImplementation(mn.jackson.databind)

    testImplementation(mn.micronaut.http.server.netty)
    testImplementation(mn.micronaut.http.client)
    testImplementation(mn.micronaut.inject)

    testImplementation(mnTest.micronaut.test.junit5)
    testImplementation(mnTest.junit.jupiter.api)
    testImplementation(mnTest.junit.jupiter.params)
    testRuntimeOnly(mnTest.junit.jupiter.engine)
    testRuntimeOnly(mnTest.junit.platform.launcher)
    testRuntimeOnly(mnLogging.logback.classic)
}

micronautBuild {
    python {
        compilerArgs.add("-Amicronaut.jsonschema.baseUri=https://example.com/schemas")
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    systemProperty "micronaut.python.pool.enabled", "false"
}
