plugins {
    id("java-library")
    id("io.micronaut.build.internal.json-schema-module")
}

dependencies {
    implementation(projects.micronautJsonSchemaGenerator)
    implementation(libs.maven.plugin.api)
    implementation(libs.maven.core)
    compileOnly(libs.micronaut.build.plugin.sourcegen.annotations)
    compileOnly(libs.maven.plugin.annotations)
    annotationProcessor(libs.micronaut.build.plugin.sourcegen.generator)
    annotationProcessor(projects.micronautJsonSchemaGenerator)
    testCompileOnly(libs.maven.plugin.annotations)
    testImplementation(libs.maven.plugin.testing.harness)
    testImplementation(mnTest.junit.jupiter.api)
    testRuntimeOnly(mnTest.junit.jupiter.engine)
    testRuntimeOnly(mnTest.junit.platform.launcher)
}

micronautBuild {
    descriptor {
        parentModuleId = "io.micronaut.jsonschema:micronaut-json-schema-maven-plugin"
    }
}

tasks.named("processResources") {
    inputs.property("projectVersion", project.version.toString())
    filesMatching("META-INF/maven/plugin.xml") {
        filter { line -> line.replace('${project.version}', project.version.toString()) }
    }
}

tasks.named("processTestResources") {
    inputs.property("projectVersion", project.version.toString())
    filesMatching("META-INF/plexus/components.xml") {
        filter { line -> line.replace('${project.version}', project.version.toString()) }
    }
}

configurations.named("annotationProcessor") {
    // Isolate sourcegen 1.0.0-M1 processor dependencies from this project's newer Micronaut/SourceGen/JavaParser BOMs.
    resolutionStrategy.force(
        "io.micronaut:micronaut-core:5.0.0-M8",
        "io.micronaut:micronaut-inject:5.0.0-M8",
        "io.micronaut:micronaut-core-processor:5.0.0-M8",
        "io.micronaut:micronaut-inject-java:5.0.0-M8",
        "io.micronaut.sourcegen:micronaut-sourcegen-annotations:1.8.4",
        "io.micronaut.sourcegen:micronaut-sourcegen-model:1.8.4",
        "io.micronaut.sourcegen:micronaut-sourcegen-generator:1.8.4",
        "io.micronaut.sourcegen:micronaut-sourcegen-generator-java:1.8.4",
        "com.github.javaparser:javaparser-core:3.27.1",
        "com.github.javaparser:javaparser-symbol-solver-core:3.27.1"
    )
}
