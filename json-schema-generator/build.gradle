import io.micronaut.testresources.buildtools.KnownModules

plugins {
    id("io.micronaut.build.internal.json-schema-module")
    id("io.micronaut.test-resources")
}

dependencies {
    compileOnly(mn.micronaut.core.processor)
    compileOnly(libs.micronaut.build.plugin.sourcegen.annotations)
    annotationProcessor(libs.micronaut.build.plugin.sourcegen.generator)

    implementation(mnSourcegen.micronaut.sourcegen.model)
    implementation(mnSourcegen.micronaut.sourcegen.generator)
    implementation(mnSourcegen.micronaut.sourcegen.generator.java)
    implementation(mnSourcegen.micronaut.sourcegen.annotations)
    implementation(mnSerde.micronaut.serde.jackson)

    api(projects.micronautJsonSchemaAnnotations)
    api(projects.micronautJsonSchemaCommon)

    testAnnotationProcessor(mn.micronaut.inject.java)
    testImplementation(mn.micronaut.inject)
    testImplementation(mn.micronaut.context)
    testImplementation(mnTestResources.testcontainers.oracle.free)
    testImplementation(mnTestResources.micronaut.test.resources.extensions.junit.platform)
    testImplementation(mn.java.parser.core)
    testImplementation(mnValidation.micronaut.validation)
    testRuntimeOnly(mnSql.ojdbc11)
    testResourcesService(mnSql.ojdbc11)
}

micronautBuild {
    descriptor {
        parentModuleId = "io.micronaut.jsonschema:micronaut-json-schema-generator"
    }
}

micronaut {
    version libs.versions.micronaut.platform.get()
    testResources {
        enabled = true
        inferClasspath = false
        additionalModules.add(KnownModules.JDBC_ORACLE_FREE)
        clientTimeout = 300
        version = libs.versions.micronaut.testresources.get()
    }
}

tasks.matching { it.name == "internalStartTestResourcesService" }.configureEach {
    if (JavaVersion.current().isCompatibleWith(JavaVersion.VERSION_25)) {
        setProperty("useClassDataSharing", false)
    }
}

tasks.withType(Test).configureEach {
    systemProperty "oracle.jdbc.timezoneAsRegion", "false"
}

configurations.named("annotationProcessor") {
    // Isolate sourcegen 1.0.0-M1 processor dependencies from this project's newer Micronaut/SourceGen/JavaParser BOMs.
    resolutionStrategy.force(
        "io.micronaut:micronaut-core:5.0.0-M8",
        "io.micronaut:micronaut-inject:5.0.0-M8",
        "io.micronaut:micronaut-core-processor:5.0.0-M8",
        "io.micronaut:micronaut-inject-java:5.0.0-M8",
        "io.micronaut.sourcegen:micronaut-sourcegen-annotations:1.8.4",
        "io.micronaut.sourcegen:micronaut-sourcegen-model:1.8.4",
        "io.micronaut.sourcegen:micronaut-sourcegen-generator:1.8.4",
        "io.micronaut.sourcegen:micronaut-sourcegen-generator-java:1.8.4",
        "com.github.javaparser:javaparser-core:3.27.1",
        "com.github.javaparser:javaparser-symbol-solver-core:3.27.1"
    )
}
