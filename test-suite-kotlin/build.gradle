    implementation(projects.micronautJsonSchemaAnnotations)
    implementation(mnSerde.micronaut.serde.jackson)

    testImplementation(projects.micronautJsonSchemaConfigurationValidator)

    kspTest(projects.micronautJsonSchemaProcessor)
    kspTest(mnSerde.micronaut.serde.processor)
    kspTest(mn.micronaut.inject.kotlin)

    api(mn.jackson.databind)

    testImplementation(mn.micronaut.http.server.netty)
    testImplementation(mn.micronaut.http.client)
    testImplementation(projects.micronautJsonSchemaValidation)
    testImplementation(mn.micronaut.inject.kotlin.test)
    testImplementation(mn.micronaut.inject.groovy.test)
    testImplementation(mn.micronaut.inject.java.test)
    testImplementation(mn.micronaut.inject)
    testImplementation(mnTest.micronaut.test.spock)
}

ksp {
    arg("micronaut.jsonschema.baseUri", "https://example.com/schemas")
}

compileTestGroovy {
    dependsOn tasks.getByPath('compileTestKotlin')
    classpath += files(compileTestKotlin)
}
test {
    useJUnitPlatform()
