def refGenerator = tasks.register("generateRef", BeanGeneratorTask) {
    language = "java"
    classpath.from(configurations.beanGenerator)
    inputDirectory.convention(layout.projectDirectory.dir("src/test/resources/ref"))
    outputDirectory.convention(layout.buildDirectory.dir("generated/jsonSchema"))
    packageName.convention("io.micronaut.jsonschema.generator.ref")
    acceptedUrlPatterns.convention(["^http://localhost:.*"])
    usesService(mockSchemaServer)
    doFirst { mockSchemaServer.get() } // force eager start before the subprocess runs
}


tasks.named("generateAnimals") {
}

tasks.named("generateFood") {
}

tasks.named("generateGithub") {
}

tasks.named("generateWordPress") {
}

tasks.named("generateRef") {
}

tasks.withType(Checkstyle).configureEach {
    enabled = false
}

sourceSets {
    test {
        java.srcDir('src/test/java')
        java.srcDir(beanGenerator.map(BeanGeneratorTask::getGeneratedSourcesDirectory))
        java.srcDir(foodGenerator.map(BeanGeneratorTask::getGeneratedSourcesDirectory))
        java.srcDir(githubGenerator.map(BeanGeneratorTask::getGeneratedSourcesDirectory))
        java.srcDir(wordPressGenerator.map(BeanGeneratorTask::getGeneratedSourcesDirectory))
        java.srcDir(refGenerator.map(BeanGeneratorTask::getGeneratedSourcesDirectory))
