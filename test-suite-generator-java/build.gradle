import io.micronaut.build.internal.generator.BeanGeneratorTask
import io.micronaut.build.internal.generator.MockSchemaServerService

plugins {
    id("java-library")
    id("io.micronaut.build.internal.test-suite-generator-java")
}

// Serves test-only JSON fixtures over HTTP so generator tasks can resolve `$ref`
// URLs without depending on remote services (see #191). Port is fixed so the
// fixture files can hardcode `http://localhost:38080/...` as their reference URL.
def mockSchemaServer = gradle.sharedServices.registerIfAbsent("mockSchemaServer", MockSchemaServerService) {
    parameters {
        fixturesDir = layout.projectDirectory.dir("src/test/resources/_fixtures")
        port = 38080
    }
    maxParallelUsages = 1
}

dependencies {
    compileOnly(mn.micronaut.core.processor)

    implementation(projects.micronautJsonSchemaGenerator)
    implementation(mnSerde.micronaut.serde.jackson)
    implementation(mnValidation.validation)

    api(projects.micronautJsonSchemaAnnotations)

    testAnnotationProcessor(mn.micronaut.inject.java)
    testAnnotationProcessor(mn.micronaut.inject.java.test)
    testAnnotationProcessor(mnSerde.micronaut.serde.processor)

    testImplementation(mn.micronaut.inject.kotlin.test)
    testImplementation(mn.micronaut.inject.groovy.test)
    testImplementation(mn.micronaut.inject.java.test)
    testImplementation(mn.micronaut.inject)
    testImplementation(mnSerde.micronaut.serde.processor)
    testImplementation(mnValidation.micronaut.validation)
    testImplementation(mnTest.micronaut.test.junit5)
    testImplementation(mnTest.junit.jupiter.api)
    testImplementation(mnTest.junit.jupiter.params)
    testRuntimeOnly(mnTest.junit.platform.launcher)
    testRuntimeOnly(mnTest.junit.jupiter.engine)
}

def beanGenerator = tasks.register("generateAnimals", BeanGeneratorTask) {
    language = "java"
    classpath.from(configurations.beanGenerator)
    jsonFile.convention(layout.projectDirectory.file("src/test/resources/animal.schema.json"))
    outputDirectory.convention(layout.buildDirectory.dir("generated/jsonSchema"))
    packageName.convention("io.micronaut.jsonschema.generator.animals")
}

def foodGenerator = tasks.register("generateFood", BeanGeneratorTask) {
    language = "java"
    classpath.from(configurations.beanGenerator)
    inputDirectory.convention(layout.projectDirectory.dir("src/test/resources/food"))
    outputDirectory.convention(layout.buildDirectory.dir("generated/jsonSchema"))
    packageName.convention("io.micronaut.jsonschema.generator.food")
